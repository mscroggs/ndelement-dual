[features]
strict = []

[package]
name = "ndelement-dual"
version = "0.1.0"
edition = "2024"
authors = [
    "Matthew Scroggs <rust@mscroggs.co.uk>",
    "Ignacia Fierro-Piccardo <ignaciapiccardo@gmail.com>",
]
description = "Dual elements for ndelement and ndgrid."
license = "BSD-3-Clause"
homepage = "https://github.com/mscroggs/ndelement-dual"
repository = "https://github.com/mscroggs/ndelement-dual"
readme = "README.md"
keywords = ["numerics"]
categories = ["mathematics", "science"]

[dependencies]
ndelement = { git = "https://codeberg.org/nd-project/nd.git", branch = "mscroggs/outward_normals", features = ["openblas-system"]}
ndfunctionspace = { git = "https://codeberg.org/nd-project/nd.git", branch = "mscroggs/outward_normals", features = ["openblas-system"]}
ndmesh = { git = "https://codeberg.org/nd-project/nd.git", branch = "mscroggs/outward_normals", features = ["openblas-system"]}
rlst = "0.6"
itertools = "0.14.*"
quadraturerules = "0.9.0"

[dev-dependencies]
approx = "0.5"
rand = "0.9"
